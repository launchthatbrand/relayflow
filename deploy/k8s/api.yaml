apiVersion: v1
kind: Service
metadata:
  name: relayflow-api
  namespace: launchthat
  labels:
    app: relayflow-api
spec:
  selector:
    app: relayflow-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayflow-api
  namespace: launchthat
  labels:
    app: relayflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relayflow-api
  template:
    metadata:
      labels:
        app: relayflow-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: relayflow-api
          image: ghcr.io/launchthatbrand/relayflow-api:latest
          imagePullPolicy: Always
          args: ["api"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relayflow-env
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relayflow-env
                  key: RABBITMQ_PASSWORD
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: relayflow-env
                  key: WEBHOOK_SECRET
            - name: CELERY_RESULT_BACKEND
              value: redis://relayflow-redis:6379/0
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayflow-worker
  namespace: launchthat
  labels:
    app: relayflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relayflow-worker
  template:
    metadata:
      labels:
        app: relayflow-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: relayflow-worker
          image: ghcr.io/launchthatbrand/relayflow-api:latest
          imagePullPolicy: Always
          args: ["worker"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relayflow-env
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relayflow-env
                  key: RABBITMQ_PASSWORD
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: relayflow-env
                  key: WEBHOOK_SECRET
            - name: CELERY_RESULT_BACKEND
              value: redis://relayflow-redis:6379/0
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from relayflow.celery_app import celery_app; celery_app.connection().connect()"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
