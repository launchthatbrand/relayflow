apiVersion: v1
kind: Service
metadata:
  name: relayflow-redis
  namespace: launchthat
  labels:
    app: relayflow-redis
spec:
  selector:
    app: relayflow-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayflow-redis
  namespace: launchthat
  labels:
    app: relayflow-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relayflow-redis
  template:
    metadata:
      labels:
        app: relayflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
