apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relayflow-postgres-data
  namespace: launchthat
  labels:
    app: relayflow
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: relayflow-postgres
  namespace: launchthat
  labels:
    app: relayflow-postgres
spec:
  selector:
    app: relayflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayflow-postgres
  namespace: launchthat
  labels:
    app: relayflow-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relayflow-postgres
  template:
    metadata:
      labels:
        app: relayflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: relay
            - name: POSTGRES_DB
              value: relayflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relayflow-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "relay", "-d", "relayflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relayflow-postgres-data
