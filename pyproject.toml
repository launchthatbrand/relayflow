[project]
name = "relayflow"
version = "0.1.0"
description = "Webhook ingestion, RabbitMQ fan-out, and Celery workers with replay."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "celery>=5.4",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["api"]

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["api/tests"]
