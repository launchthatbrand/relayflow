services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relayflow
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relayflow"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7
    ports:
      - "63799:6379"
  rabbitmq:
    image: rabbitmq:3.13
    ports:
      - "56729:5672"
