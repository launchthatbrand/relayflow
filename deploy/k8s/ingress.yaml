apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relayflow
  namespace: launchthat
  labels:
    app: relayflow
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: relayflow.apps.onpoint.host
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: relayflow-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relayflow-web
                port:
                  number: 3000
