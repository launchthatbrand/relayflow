apiVersion: v1
kind: Service
metadata:
  name: relayflow-web
  namespace: launchthat
  labels:
    app: relayflow-web
spec:
  selector:
    app: relayflow-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayflow-web
  namespace: launchthat
  labels:
    app: relayflow-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relayflow-web
  template:
    metadata:
      labels:
        app: relayflow-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: relayflow-web
          image: ghcr.io/launchthatbrand/relayflow-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
