[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root
level = WARNING

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
handlers = console
level = WARNING

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
